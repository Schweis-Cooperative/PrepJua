services:
  prepjua:
    build: .
    container_name: prepjua-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - prepjua-logs:/app/logs
      - prepjua-user-logs:/app/user_logs

volumes:
  prepjua-logs:
  prepjua-user-logs:
